# Frontend Elora — SPA Vite estatico.
# Cobre apex (elora.app.br), www e wildcard subdomain (clinica-x.elora.app.br
# pro multi-tenant). Server blocks api/chat/evolution (match exato) tem
# precedencia sobre este wildcard.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elora.app.br www.elora.app.br *.elora.app.br;

    ssl_certificate     /etc/letsencrypt/live/elora.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elora.app.br/privkey.pem;

    # HSTS 6 meses sem includeSubDomains/preload por enquanto. Quando estiver
    # firme em prod, subir pra 1 ano + preload + adicionar dominio em hstspreload.org
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /srv/elora/repo/apps/frontend/dist;
    index index.html;

    # Cache forte pros assets imutaveis (Vite gera hash no filename — bust automatico)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker das notificações push — sempre revalidado, senão o
    # navegador segura a versão velha até 24h depois do deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Manifest do PWA — MIME explícito (mime.types antigo não conhece
    # .webmanifest e serviria application/octet-stream).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — qualquer rota inexistente retorna index.html (React Router
    # decide). Mantem o multi-tenant funcionando: clinica-x.elora.app.br/leads
    # bate aqui (subdomain wildcard) e index.html assume o resto.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SEM cache — sempre busca a versao nova (que aponta pros assets
    # com hash novo).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    access_log /var/log/nginx/elora-frontend.access.log;
    error_log  /var/log/nginx/elora-frontend.error.log;
}
