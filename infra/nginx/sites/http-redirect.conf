# Redirect HTTP -> HTTPS pra todos os dominios Elora.
# Tambem responde challenge HTTP-01 do Let's Encrypt (caso usemos no futuro pra
# certificado adicional sem DNS — wildcard atual usa DNS-01).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name elora.app.br *.elora.app.br;

    # Webroot pra challenge HTTP-01 do certbot (compat futura)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
