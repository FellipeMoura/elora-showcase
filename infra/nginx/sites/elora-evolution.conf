# Evolution API — gateway WhatsApp (porta 5503). Acesso admin (autenticado
# via header AUTHENTICATION_API_KEY no app — Nginx so transporta).
#
# CUIDADO: Evolution expoe rotas administrativas (create instance, delete,
# logout etc.). Sem o header correto, retorna 401. Mesmo assim, considerar
# adicionar allowlist de IPs no futuro (so do escritorio + VPN).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evolution.elora.app.br;

    ssl_certificate     /etc/letsencrypt/live/elora.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elora.app.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Uploads de midia ao enviar mensagens (POST /message/sendMedia/<instance>)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5503;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Evolution emite eventos via webhook (POST pra chat.elora.app.br),
        # nao usa WebSocket persistente. Mantemos upgrade pra compat futura.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /var/log/nginx/elora-evolution.access.log;
    error_log  /var/log/nginx/elora-evolution.error.log;
}
