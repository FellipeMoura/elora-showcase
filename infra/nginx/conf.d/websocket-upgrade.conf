# Mapa pra Socket.IO upgrade (long-lived WebSocket).
# Definido em escopo http (via /etc/nginx/conf.d/) e usado pelos server blocks
# api/chat/evolution. Sem isso, o header Connection nao e propagado corretamente
# e o WebSocket falha pra abrir.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
