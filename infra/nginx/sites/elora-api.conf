# API Elora — apps/core (porta 5501). HTTP REST + Socket.IO.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.elora.app.br;

    ssl_certificate     /etc/letsencrypt/live/elora.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elora.app.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # API JSON normalmente nao precisa de payload grande. 5MB cobre upload de
    # avatares e listas razoaveis. Caso veja 413 nos logs, ajustar.
    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:5501;
        proxy_http_version 1.1;

        # Headers padrao de proxy reverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Socket.IO upgrade (long-lived WebSocket). $connection_upgrade vem do
        # map em conf.d/websocket-upgrade.conf.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts altos pra suportar Socket.IO em standby (1h)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/elora-api.access.log;
    error_log  /var/log/nginx/elora-api.error.log;
}
