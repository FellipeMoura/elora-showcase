# Chat Elora — apps/chat (porta 5502). Recebe webhooks do Evolution + futuras
# conexoes WebSocket. Endpoint critico — qualquer downtime quebra mensagens.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.elora.app.br;

    ssl_certificate     /etc/letsencrypt/live/elora.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elora.app.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Webhooks Evolution mandam payloads com midia em base64 — pode passar de
    # 1MB tranquilo. 50MB cobre videos, audios, documentos do WhatsApp.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5502;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/elora-chat.access.log;
    error_log  /var/log/nginx/elora-chat.error.log;
}
